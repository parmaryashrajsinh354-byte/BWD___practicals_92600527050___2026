<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Portal - Student Login</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <!-- Responsive Column: Full width on mobile, narrower card on tablets/desktops -->
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            
            <!-- Header / Branding -->
            <div class="text-center mb-4">
              <h3 class="fw-bold text-primary mb-1">College Portal</h3>
              <p class="text-muted small">Sign in to access your Sem-1 dashboard</p>
            </div>

            <!-- Login Form -->
            <form action="#" method="POST">
              
              <!-- Email / Enrollment ID Input -->
              <div class="mb-3">
                <label for="studentEmail" class="form-label fw-semibold">Email or Enrollment ID</label>
                <input 
                  type="email" 
                  class="form-control form-control-lg fs-6" 
                  id="studentEmail" 
                  placeholder="student@college.edu" 
                  required
                >
              </div>

              <!-- Password Input -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="studentPassword" class="form-label fw-semibold mb-1">Password</label>
                  <a href="#forgot" class="text-decoration-none small">Forgot password?</a>
                </div>
                <input 
                  type="password" 
                  class="form-control form-control-lg fs-6" 
                  id="studentPassword" 
                  placeholder="Enter your password" 
                  required
                >
              </div>

              <!-- Remember Me Checkbox -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">
                  Keep me signed in
                </label>
              </div>

              <!-- Full-Width Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fs-6 fw-semibold">
                  Sign In
                </button>
              </div>

            </form>

            <!-- Footer Link -->
            <div class="text-center mt-4">
              <p class="text-muted small mb-0">
                New student? <a href="#register" class="text-primary fw-semibold text-decoration-none">Activate Account</a>
              </p>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
