<!DOCTYPE html>
<html>
<head>
  <style>
    table {
      border-collapse: collapse;
      width: 50%;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>City</th>
    </tr>
    <tr>
      <td>Aarav</td>
      <td>Developer</td>
      <td>Mumbai</td>
    </tr>
    <tr>
      <td>Priya</td>
      <td>Designer</td>
      <td>Rajkot</td>
    </tr>
  </table>

</body>
</html>
